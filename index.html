<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16213E">
  <title>مخزن الخليل — الأسعار</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // تطبيق الثيم قبل الرسم لتفادي الوميض
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>

  <!-- ===== شاشة الدخول ===== -->
  <section id="login-view" class="login hidden">
    <div class="login-hero">
      <img src="img/poster.jpg" alt="مخزن الخليل — بإدارة الأستاذ إبراهيم" width="720" height="1030">
      <h1 class="sr-only">مخزن الخليل — نظام الأسعار</h1>
    </div>
    <form id="login-form" class="card" novalidate>
      <div class="field">
        <label for="login-email">اسم المستخدم</label>
        <input id="login-email" class="input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
      </div>
      <div class="field">
        <label for="login-pass">كلمة السر</label>
        <input id="login-pass" class="input" type="password" autocomplete="current-password" dir="ltr" required>
      </div>
      <div id="login-error" class="alert alert-danger hidden" role="alert"></div>
      <button class="btn btn-accent btn-block" type="submit">دخول</button>
    </form>
  </section>

  <!-- ===== التطبيق ===== -->
  <div id="app-view" class="app hidden">
    <header class="band">
      <div class="band-row">
        <div>
          <div class="sub" id="today"></div>
          <h1 id="page-title">مخزن الخليل</h1>
        </div>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="تبديل الوضع الليلي والنهاري">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <div class="offline-banner" role="status">
      <span>بلا نت — عم تشوف آخر نسخة محفوظة. التعديل بيرجع يشتغل لما يرجع النت.</span>
    </div>

    <main id="screen"></main>

    <nav class="nav" aria-label="التنقل الرئيسي">
      <div class="nav-inner">
        <a href="#home" data-route="home">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span>الرئيسية</span>
        </a>
        <a href="#items" data-route="items">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>المواد</span>
        </a>
        <a href="#new-item" data-route="new-item" aria-label="إضافة صنف">
          <span class="fab"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        </a>
        <a href="#prices" data-route="prices">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span>الأسعار</span>
        </a>
        <a href="#settings" data-route="settings">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <span>الإعدادات</span>
        </a>
      </div>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/whatsapp-builder.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/groups.js"></script>
  <script src="js/screens/item-form.js"></script>
  <script src="js/screens/items.js"></script>
  <script src="js/screens/prices.js"></script>
  <script src="js/screens/whatsapp.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
